name: Unified Remote Fabric R01

on:
  push:
    branches:
      - wexspace/unified-remote-fabric-r01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest -r services/pairing_relay/requirements.txt httpx
      - name: Run remote-fabric tests
        env:
          PYTHONPATH: src:.
        run: pytest -q tests/test_remote_fabric.py tests/test_remote_app_surface.py tests/test_pairing_relay.py tests/test_pairing_relay_http.py
      - name: Compile module
        run: python -m py_compile src/wexspace_human_governed_core/remote_fabric.py src/wexspace_human_governed_core/remote_app_surface.py scripts/openai_remote_pairing_probe.py services/pairing_relay/core.py services/pairing_relay/app.py
